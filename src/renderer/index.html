<!DOCTYPE html>
<html lang="zh-TW" data-ui-theme="cyrene-night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyrene</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    #live2d-canvas {
      display: block;
      width: 100%; height: 100%;
      opacity: 0;
      transform: translateY(4px) scale(0.985);
      transition:
        opacity 360ms ease-out,
        transform 440ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.is-ready #live2d-canvas {
      opacity: 1;
      transform: none;
    }
    #pet-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 30;
      pointer-events: none;
      transition: opacity 220ms ease, transform 280ms ease;
    }
    body.is-ready #pet-loader {
      opacity: 0;
      transform: translateY(-4px) scale(0.94);
    }
    /* 粉紫愛心：兩片圓角葉瓣各轉 ±45° 拼成心形（經典 CSS heart 作法）。 */
    .pet-loader__heart {
      position: relative;
      width: 46px;
      height: 42px;
      filter: drop-shadow(0 5px 10px rgba(168, 85, 247, 0.28));
      animation: heart-beat 1.35s ease-in-out infinite;
    }
    /* 單一元素 + clip-path 心形，讓整顆共用同一個漸層。
       （用兩片旋轉葉瓣拼會在中線留下漸層接縫，故不採用。） */
    .pet-loader__heart::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(150deg, rgba(255, 173, 216, 0.96), rgba(178, 142, 255, 0.94) 78%);
      clip-path: path("M23 42C23 42 2 27 2 13C2 5.8 7.8 1 13.8 1C18 1 21.4 3.3 23 6.5C24.6 3.3 28 1 32.2 1C38.2 1 44 5.8 44 13C44 27 23 42 23 42Z");
    }
    /* 左上角高光，讓心形不會是一塊死板的色塊 */
    .pet-loader__shine {
      position: absolute;
      left: 11px;
      top: 9px;
      width: 9px;
      height: 7px;
      border-radius: 50%;
      transform: rotate(-38deg);
      background: rgba(255, 255, 255, 0.85);
      filter: blur(0.5px);
      z-index: 1;
    }
    /* 正常載入時只留愛心，不顯示文字；但保留在 DOM 中供 aria-live 朗讀，
       並在載入失敗時（.is-load-error）現身說明原因，見 main.ts showPetLoadError()。 */
    .pet-loader__label {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      border: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    body.is-load-error .pet-loader__label {
      width: auto;
      height: auto;
      margin: 0;
      overflow: visible;
      clip-path: none;
      top: calc(50% + 35px);
      padding: 5px 10px 6px;
      border: 1px solid rgba(255, 177, 220, 0.36);
      border-radius: 999px;
      background: rgba(255, 249, 253, 0.82);
      box-shadow: 0 6px 18px rgba(116, 70, 145, 0.12);
      font: 600 12px/1.2 system-ui, -apple-system, "PingFang TC", sans-serif;
      letter-spacing: 0.06em;
      backdrop-filter: blur(8px);
    }
    body.is-load-error .pet-loader__heart {
      animation: none;
      opacity: 0.58;
    }
    body.is-load-error .pet-loader__label {
      color: #b42358;
    }
    /* 心跳：兩段收縮模擬 lub-dub，同時輕微浮動 */
    @keyframes heart-beat {
      0%, 100% { transform: translateY(1px) scale(1); }
      15% { transform: translateY(0) scale(1.11); }
      30% { transform: translateY(0) scale(1.02); }
      45% { transform: translateY(-3px) scale(1.08); }
      70% { transform: translateY(-2px) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #live2d-canvas,
      #pet-loader { transition-duration: 1ms; }
      .pet-loader__heart { animation: none; }
    }
    /* Opener 主動開口氣泡 */
    #opener-bubble {
      position: absolute;
      bottom: 64%;
      left: 58%;
      transform: translateX(-50%);
      width: max-content;
      min-width: 220px;
      max-width: min(310px, calc(100vw - 24px));
      padding: 10px 16px;
      background: rgba(204, 188, 251, 0.96);
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: left;
      text-wrap: pretty;
      color: #df5da9;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: auto;
      cursor: pointer;
      z-index: 10;
    }
    #opener-bubble.opener-bubble--show { opacity: 1; }
    #opener-bubble::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-top-color: rgba(204, 188, 251, 0.96);
      border-bottom: 0;
    }
    #pet-chat-form {
      position: absolute;
      left: 50%;
      bottom: 54px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      width: min(244px, calc(100% - 48px));
      padding: 4px;
      border: 1px solid rgba(197, 125, 236, 0.48);
      border-radius: 18px;
      background: rgba(24, 14, 31, 0.88);
      box-shadow: 0 8px 28px rgba(20, 7, 27, 0.28);
      backdrop-filter: blur(12px);
      z-index: 20;
    }
    #pet-chat-form[hidden] { display: none; }
    #pet-chat-input {
      min-width: 0;
      flex: 1;
      height: 30px;
      padding: 0 8px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font: 13px/1.2 system-ui, sans-serif;
      user-select: text;
    }
    #pet-chat-input::placeholder { color: rgba(233, 216, 240, 0.62); }
    #pet-chat-submit {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      font-size: 17px;
      cursor: pointer;
    }
    #pet-chat-submit:disabled { opacity: 0.5; cursor: wait; }
  </style>
  <link rel="stylesheet" href="./ui/tokens.css" />
  <link rel="stylesheet" href="./ui/fonts.css" />
  <link rel="stylesheet" href="./ui/base.css" />
  <link rel="stylesheet" href="./ui/theme.css" />
  <!-- Cubism 4 Core (required by pixi-live2d-display/cubism4) -->
  <script src="/live2dcubismcore.min.js"></script>
</head>
<body class="is-booting">
  <div id="pet-loader" role="status" aria-live="polite">
    <div class="pet-loader__heart" aria-hidden="true"><span class="pet-loader__shine"></span></div>
    <span class="pet-loader__label">昔漣醒來中…</span>
  </div>
  <canvas id="live2d-canvas"></canvas>
  <div id="opener-bubble" role="status" aria-live="polite" hidden></div>
  <form id="pet-chat-form" aria-label="和昔漣快速對話" hidden>
    <input id="pet-chat-input" type="text" maxlength="500" autocomplete="off" placeholder="和昔漣說話…" aria-label="輸入訊息" />
    <button id="pet-chat-submit" type="submit" aria-label="送出訊息">↑</button>
  </form>
  <script type="module" src="./main.ts"></script>
</body>
</html>
