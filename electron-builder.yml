appId: com.cyrene.desktop
productName: 昔漣桌寵
executableName: Agent
directories:
  output: release
asar: true
electronDist: node_modules/electron/dist
afterPack: scripts/after-pack.cjs
files:
  - dist/**/*
  - package.json
  - prompts/**/*
  - assets/**/*
  - mobile/**/*
  - skills/**/*
  - game-recipes/**/*
  - vendor/**/*
  - "!vendor/**/.venv"
  - "!vendor/**/.venv/**/*"
  - "!vendor/**/node_modules"
  - "!vendor/**/node_modules/**/*"
  - models/**/*
  # Source maps are development-only and account for hundreds of megabytes in
  # production dependencies. Cross-platform ONNX binaries are likewise never
  # loaded by the Apple Silicon build.
  - "!**/*.map"
  - "!node_modules/onnxruntime-node/bin/napi-v3/linux/**/*"
  - "!node_modules/onnxruntime-node/bin/napi-v3/win32/**/*"
  - "!node_modules/onnxruntime-node/bin/napi-v3/darwin/x64/**/*"
mac:
  icon: assets/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  extendInfo:
    NSMicrophoneUsageDescription: 昔漣需要使用麥克風才能進行通話與語音辨識（ASR）。
    NSCameraUsageDescription: 昔漣需要使用攝影機才能在通話中分享畫面。
win:
  target:
    - dir
  extraResources:
    - from: resources/bin/cyrene-screenshot.exe
      to: bin/cyrene-screenshot.exe
